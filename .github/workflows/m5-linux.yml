name: M5 Linux qualification

on:
  push:
    branches: [main, m5-candidate]
  pull_request:
  workflow_dispatch:
    inputs:
      capacity_seconds:
        description: Capacity run duration in seconds (10..7200)
        default: '600'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run server:build

  capacity:
    # In-process scheduler lateness/executed-batch evidence on Linux. Not Fly
    # shared-CPU quota, TCP or fairness evidence.
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: node tools/m5/build-qualification.mjs
      - name: Record environment
        run: |
          mkdir -p captures-local/m5-local
          { uname -a; nproc; node --version; cat /proc/cpuinfo | grep 'model name' | head -1; } | tee captures-local/m5-local/environment.txt
      - name: Run capacity measurement
        run: node dist-server/qualify-local.mjs "${{ github.event.inputs.capacity_seconds || '60' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-linux-capacity
          path: captures-local/m5-local/
      - name: Check gates (lateness p99 <= 10 ms, batch p99 < 20 ms, no overruns)
        run: |
          node --input-type=module -e "
          import { readdirSync, readFileSync } from 'node:fs';
          const dir = 'captures-local/m5-local';
          const file = readdirSync(dir).filter(f => f.startsWith('capacity-')).sort().at(-1);
          const r = JSON.parse(readFileSync(dir + '/' + file, 'utf8'));
          const checks = [
            ['latenessP99Ms <= 10', r.latenessP99Ms !== null && r.latenessP99Ms <= 10, r.latenessP99Ms],
            ['executedBatchP99Ms < 20', r.executedBatchP99Ms !== null && r.executedBatchP99Ms < 20, r.executedBatchP99Ms],
            ['overruns == 0', r.metrics.overruns === 0, r.metrics.overruns],
            ['liveClients == 20', r.liveClients === 20, r.liveClients],
          ];
          for (const [name, ok, value] of checks) console.log((ok ? 'PASS ' : 'FAIL ') + name + ' (' + value + ')');
          if (checks.some(c => !c[1])) process.exit(1);
          "

  netem-shaper:
    # Verifies tools/m5/ingress-netem.sh actually shapes TCP between isolated
    # network namespaces on this runner. Prerequisite only; not a fairness cell.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load kernel modules
        run: |
          sudo modprobe sch_netem && sudo modprobe ifb numifbs=0 || {
            sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem && sudo modprobe ifb numifbs=0
          }
          { uname -r; tc -V; ip -V; } | tee shaper-environment.txt
      - name: Create server/client namespaces
        run: |
          sudo ip netns add cbm5srv
          sudo ip netns add cbm5a
          sudo ip link add vsrv type veth peer name va
          sudo ip link set vsrv netns cbm5srv
          sudo ip link set va netns cbm5a
          sudo ip -n cbm5srv addr add 10.55.0.1/24 dev vsrv
          sudo ip -n cbm5a addr add 10.55.0.2/24 dev va
          sudo ip -n cbm5srv link set vsrv up
          sudo ip -n cbm5a link set va up
          sudo ip -n cbm5srv link set lo up
          sudo ip -n cbm5a link set lo up
      - name: Measure unshaped and shaped TCP connect time
        run: |
          sudo ip netns exec cbm5srv python3 -m http.server 8787 --bind 10.55.0.1 >/dev/null 2>&1 &
          sleep 1
          measure() {
            for i in $(seq 1 40); do
              sudo ip netns exec cbm5a curl -s -o /dev/null -w '%{time_connect}\n' http://10.55.0.1:8787/
            done | sort -n | awk '{a[NR]=$1} END {print a[int((NR+1)/2)]}'
          }
          base=$(measure)
          # Downstream C3-like profile on client receiver: 40 ms base, 10 ms uniform jitter, 1% loss.
          sudo ip netns exec cbm5a bash tools/m5/ingress-netem.sh va cbm5a 10.55.0.1 downstream 8787 40 10 1 1234 10 | tee tc-after-setup.txt
          shaped=$(measure)
          sudo ip netns exec cbm5a tc -s qdisc show dev cbm5a | tee tc-after-traffic.txt
          echo "median connect unshaped=${base}s shaped=${shaped}s" | tee shaper-result.txt
          awk -v s="$shaped" 'BEGIN { exit !(s >= 0.030 && s <= 0.100) }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-netem-shaper
          path: |
            shaper-environment.txt
            tc-after-setup.txt
            tc-after-traffic.txt
            shaper-result.txt
