# Review template. Replace app/origin only after separate publication authorization.
app = "REPLACE_ME"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  ALLOWED_ORIGINS = "https://FRONTEND.example.invalid"
  TRUST_FLY_PROXY = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[http_service.concurrency]
  type = "connections"
  soft_limit = 48
  hard_limit = 64

[http_service.http_options]
  idle_timeout = 600

[[http_service.checks]]
  grace_period = "10s"
  interval = "10s"
  timeout = "2s"
  method = "GET"
  path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
